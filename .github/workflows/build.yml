name: build-desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # On a tag push, publish the installers to GitHub Releases (feeds
      # electron-updater via latest*.yml). On manual dispatch, build only.
      - name: Build
        run: npx electron-builder --${{ matrix.target }} --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing / notarization: leave these secrets unset for an unsigned
          # build; set them (repo Settings → Secrets) to sign + notarize
          # automatically. macOS uses APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD +
          # APPLE_TEAM_ID (or the APPLE_API_KEY trio); Windows/macOS signing uses
          # CSC_LINK + CSC_KEY_PASSWORD.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Never auto-discover a machine keychain on CI; only CSC_LINK above.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Smoke test (packaged host boots)
        run: node smoke.js

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: ignore
